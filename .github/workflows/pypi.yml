name: PyPI

# Builds the schema-sidecar package from a release tag and uploads it where
# the PYPI_RELEASE_ENABLED variable says: unset or "false", nowhere;
# "testpypi", TestPyPI; "true", PyPI. publish.yml dispatches it on the tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to publish, e.g. v0.6.0; run the workflow on that tag"
        required: true
        type: string

permissions: {}

concurrency:
  group: pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the package (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      # The version comes from the tag.
      - name: Check the run stands on the release tag
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not vMAJOR.MINOR.PATCH."
            exit 1
          fi
          if [ "$REF" != "refs/tags/$TAG" ]; then
            echo "::error::This run is on $REF. Run it on the tag: gh workflow run pypi.yml --ref $TAG -f tag=$TAG"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # No cache: another workflow could write one.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      # From lmodel/linkml-project-copier at the scaffold's pin; the script
      # checks the tag's commit and the files' git tree.
      - name: Fetch the template the package carries
        run: python3 scripts/carry-template.py

      - name: Build the source distribution and the wheel
        run: uv build --python 3.12 --build-constraints .pypi/requirements.txt --require-hashes --out-dir dist

      # uv writes a .gitignore into dist/, so hidden files are not counted.
      - name: Check the files carry the tag's version
        run: |
          version="${TAG#v}"
          expected="$(printf '%s\n' "schema_sidecar-$version-py3-none-any.whl" "schema_sidecar-$version.tar.gz")"
          actual="$(cd dist && find . -type f ! -name '.*' | sed 's|^\./||' | LC_ALL=C sort)"
          if [ "$actual" != "$expected" ]; then
            printf '::error::dist/ should hold the package at %s, and holds:\n%s\n' "$version" "$actual"
            exit 1
          fi

      - name: Check a second build makes the same bytes
        run: |
          uv build --python 3.12 --build-constraints .pypi/requirements.txt --require-hashes --out-dir "$RUNNER_TEMP/again"
          for file in dist/*; do
            cmp "$file" "$RUNNER_TEMP/again/${file#dist/}" || { echo "::error::$file came out different from a second build."; exit 1; }
          done

      - name: Install the wheel and install the skills from it
        run: |
          uv venv -q --python 3.9 "$RUNNER_TEMP/try"
          uv pip install -q --no-index --python "$RUNNER_TEMP/try/bin/python" dist/*.whl
          "$RUNNER_TEMP/try/bin/schema-sidecar" --version
          "$RUNNER_TEMP/try/bin/schema-sidecar" skills install --dest "$RUNNER_TEMP/skills"
          diff -r --exclude=assets skills "$RUNNER_TEMP/skills"
          diff -r carried-template/linkml-project-copier "$RUNNER_TEMP/skills/linkml-sidecar/assets/linkml-project-copier"
          "$RUNNER_TEMP/try/bin/schema-sidecar" skills status --dest "$RUNNER_TEMP/skills"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  upload:
    name: Upload to ${{ vars.PYPI_RELEASE_ENABLED == 'true' && 'PyPI' || 'TestPyPI' }}
    needs: build
    if: vars.PYPI_RELEASE_ENABLED == 'true' || vars.PYPI_RELEASE_ENABLED == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ vars.PYPI_RELEASE_ENABLED == 'true' && 'pypi' || 'testpypi' }}
      url: ${{ vars.PYPI_RELEASE_ENABLED == 'true' && 'https://pypi.org/project/schema-sidecar/' || 'https://test.pypi.org/project/schema-sidecar/' }}
    permissions:
      id-token: write # trusted publishing
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Upload schema-sidecar
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ vars.PYPI_RELEASE_ENABLED == 'true' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          packages-dir: dist/
          skip-existing: true
          attestations: true

  attach:
    name: Attach the checksums and the provenance to the release
    needs: upload
    if: vars.PYPI_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release upload
      id-token: write # sign the build-provenance attestation
      attestations: write # store the attestation
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # Checked with `gh attestation verify <file> -R lmodel/schema-sidecar`.
      # The patterns leave out the .gitignore uv writes into dist/.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Write and attach a .sha256 file for each package file, and the provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mkdir sums
          for file in dist/*.whl dist/*.tar.gz; do
            (cd dist && sha256sum "$(basename "$file")") > "sums/$(basename "$file").sha256"
          done
          cat sums/*.sha256
          cp -- "$BUNDLE" "sums/provenance-$TAG-packages.intoto.jsonl"
          gh release upload "$TAG" sums/*.sha256 "sums/provenance-$TAG-packages.intoto.jsonl" --clobber --repo "$GITHUB_REPOSITORY"
