name: PyPI

# Publishes the `schema-sidecar` package to PyPI by trusted publishing: the
# two skills, the command that installs them, and inside linkml-sidecar the
# template it lays down, so a machine that reaches a package index and no git
# host can install the skills and lay down a schema project
# (docs/install.md). It runs no LLM or agent, and it never commits or pushes.
#
# publish.yml dispatches it once `gh skill publish` has made the tag, because
# GitHub starts no workflow for a release made with the default GITHUB_TOKEN.
# A maintainer can run it by hand too, naming the tag, to retry an upload.
# Either way it must run on the tag itself: `--ref "$TAG"`.
#
# The PYPI_RELEASE_ENABLED repository variable decides where the files go:
#
#   unset or "false"   nowhere: the run builds and checks the package only
#   "testpypi"         TestPyPI, through the `testpypi` environment
#   "true"             PyPI, through the `pypi` environment
#
# PyPI's trusted publisher names this workflow file and the environment, not
# the ref, so the environment is the guard: limit `pypi` and `testpypi` to
# tags matching v*, under Settings, Environments, Deployment branches and
# tags, and register a publisher on each index for schema-sidecar, with owner
# lmodel, repository schema-sidecar, workflow pypi.yml and that environment's
# name.
#
# Three jobs, for least privilege. `build` fetches the template, runs the
# build backend (third-party packages, installed at the hashes
# .github/pypi/requirements.txt holds) under a read-only token. `upload`
# holds the OIDC token, runs no build and no repository code, and uploads
# only the files `build` made. The publish action attaches a PEP 740
# attestation to each file. `attach` holds the write token, runs only gh,
# sha256sum and GitHub's attest action, and adds each file's checksum to the
# GitHub release, where anyone can compare a file from PyPI, or one they
# rebuild from the tag, against it. Beside the checksums goes the files'
# signed build provenance, as provenance-<tag>-packages.intoto.jsonl.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to publish, e.g. v0.6.0; run the workflow on that tag"
        required: true
        type: string

permissions: {}

concurrency:
  group: pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the package (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # The version is read from the tag, so the run must stand on it, and
      # the tag must be a release tag.
      - name: Check the run stands on the release tag
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not vMAJOR.MINOR.PATCH."
            exit 1
          fi
          if [ "$REF" != "refs/tags/$TAG" ]; then
            echo "::error::This run is on $REF. Run it on the tag: gh workflow run pypi.yml --ref $TAG -f tag=$TAG"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # No cache: this job makes the files that are published, and a cache
      # another workflow can write is an input they should not have.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      # The template at the scaffold's pin, from the lmodel organisation's
      # copy of linkml-project-copier, which carries upstream's tags. The
      # script refuses a tag that names another commit, and files whose git
      # tree is not that commit's, and writes the record the scaffold checks.
      - name: Fetch the template the package carries
        run: python3 scripts/carry-template.py

      # The build backend comes at the hashes .github/pypi/requirements.txt
      # holds, and runs on one named Python, so that anyone who rebuilds a
      # release from its tag with the same command gets the same bytes.
      - name: Build the source distribution and the wheel
        run: uv build --python 3.12 --build-constraints .github/pypi/requirements.txt --require-hashes --out-dir dist

      # A version that is not the tag's would publish under the wrong name,
      # and PyPI never takes a file name twice. uv writes a .gitignore into
      # the folder it builds into, which is no package, so hidden files are
      # left out of the count.
      - name: Check the files carry the tag's version
        run: |
          version="${TAG#v}"
          expected="$(printf '%s\n' "schema_sidecar-$version-py3-none-any.whl" "schema_sidecar-$version.tar.gz")"
          actual="$(cd dist && find . -type f ! -name '.*' | sed 's|^\./||' | LC_ALL=C sort)"
          if [ "$actual" != "$expected" ]; then
            printf '::error::dist/ should hold the package at %s, and holds:\n%s\n' "$version" "$actual"
            exit 1
          fi

      # The promise that anyone can rebuild a release and compare it with
      # PyPI's file holds only if a build makes the same bytes every time.
      - name: Check a second build makes the same bytes
        run: |
          uv build --python 3.12 --build-constraints .github/pypi/requirements.txt --require-hashes --out-dir "$RUNNER_TEMP/again"
          for file in dist/*; do
            cmp "$file" "$RUNNER_TEMP/again/${file#dist/}" || { echo "::error::$file came out different from a second build."; exit 1; }
          done

      # The wheel has no dependency, so it installs with no index at all. The
      # skills it installs must be the tag's, and the template the one the
      # scaffold pins.
      - name: Install the wheel and install the skills from it
        run: |
          uv venv -q --python 3.9 "$RUNNER_TEMP/try"
          uv pip install -q --no-index --python "$RUNNER_TEMP/try/bin/python" dist/*.whl
          "$RUNNER_TEMP/try/bin/schema-sidecar" --version
          "$RUNNER_TEMP/try/bin/schema-sidecar" skills install --dest "$RUNNER_TEMP/skills"
          diff -r --exclude=assets skills "$RUNNER_TEMP/skills"
          diff -r carried-template/linkml-project-copier "$RUNNER_TEMP/skills/linkml-sidecar/assets/linkml-project-copier"
          "$RUNNER_TEMP/try/bin/schema-sidecar" skills status --dest "$RUNNER_TEMP/skills"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  upload:
    name: Upload to ${{ vars.PYPI_RELEASE_ENABLED == 'true' && 'PyPI' || 'TestPyPI' }}
    needs: build
    if: vars.PYPI_RELEASE_ENABLED == 'true' || vars.PYPI_RELEASE_ENABLED == 'testpypi'
    # The publish action is a Docker action that runs only on Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ vars.PYPI_RELEASE_ENABLED == 'true' && 'pypi' || 'testpypi' }}
      url: ${{ vars.PYPI_RELEASE_ENABLED == 'true' && 'https://pypi.org/project/schema-sidecar/' || 'https://test.pypi.org/project/schema-sidecar/' }}
    permissions:
      id-token: write # the OIDC token for trusted publishing
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # A file the index already holds is skipped, so a run repeated after a
      # partial upload finishes the job; the builds are reproducible, so the
      # file it skips is the one it would have sent.
      - name: Upload schema-sidecar
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ vars.PYPI_RELEASE_ENABLED == 'true' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          packages-dir: dist/
          skip-existing: true
          attestations: true

  attach:
    name: Attach the checksums and the provenance to the release
    needs: upload
    if: vars.PYPI_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release upload
      id-token: write # sign the build-provenance attestation
      attestations: write # store the attestation
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # A signed record of the workflow run, commit and tag that built each
      # file, beside the PEP 740 attestation PyPI holds. Anyone checks a file,
      # one fetched from PyPI too, with `gh attestation verify <file> -R
      # lmodel/schema-sidecar`, and without GitHub's attestation API by adding
      # `--bundle` and the release's provenance-<tag>-packages.intoto.jsonl.
      # The patterns name the package files, since the attest action also
      # matches the .gitignore uv writes beside them.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Write and attach a .sha256 file for each package file, and the provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mkdir sums
          for file in dist/*.whl dist/*.tar.gz; do
            (cd dist && sha256sum "$(basename "$file")") > "sums/$(basename "$file").sha256"
          done
          cat sums/*.sha256
          cp -- "$BUNDLE" "sums/provenance-$TAG-packages.intoto.jsonl"
          gh release upload "$TAG" sums/*.sha256 "sums/provenance-$TAG-packages.intoto.jsonl" --clobber --repo "$GITHUB_REPOSITORY"
