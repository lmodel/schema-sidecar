# The copier answers linkml-sidecar gives the template, rendered by the
# scaffold from the facts Step 0 resolved. There is never an upstream example:
# the skill lays down its own, which lints clean, and copier would recreate a
# deleted one on update. A sidecar answers the last three the same every time:
# the host's license pre-seeded as .linkml/LICENSE, and no PyPI or
# docs-preview workflows, which would be inert inside .linkml/. A project at
# the root names the license file the folder holds, or none, and turns the
# two workflows on only when asked.
project_name: "<PROJ_NAME>"
project_slug: "<PROJ_SLUG>"
email: "<EMAIL>"
full_name: "<FULL_NAME>"
github_org: "<GITHUB_ORG>"
project_description: "<PROJ_DESC>"
existing_license_file: "<LICENSE_FILE>"
license: "<LICENSE_ID>"
copyright_year: "<COPYRIGHT_YEAR>"
add_example: false
gh_action_pypi: <GH_ACTION_PYPI>
gh_action_docs_preview: <GH_ACTION_DOCS_PREVIEW>
